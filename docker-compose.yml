services:
  next:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    environment:
      NODE_ENV: development
      WATACHPACK_POOLING: "true"

    command: >
      sh -c "
        chown -R node:node /app/node_modules &&
        su-exec node npm run dev -- --hostname 0.0.0.0
      "

volumes:
  node_modules: